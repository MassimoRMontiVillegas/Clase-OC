        <h1>
            Formulario.
        </h1>
        <p>
            Rellena el formulario correspondiente.
        </p>
   </header> 
   <main>
        <section>
            <label>
                Nombre:
            </label>
            <input type="text" placeholder="Ej: María" required>
            <br>

            <label>
                Contraseña:
            </label>
            <input type="password" placeholder="Ej: 12345678" required>
            <br>

            <label>
                Fecha de Nacimiento:
            </label>
            <input type="date" required>
            <br>

            <button type="submit">
                Enviar Datos
            </button>
            <br>

            <a href="./index.html">
                <button type="button">
                    Volver a la página anterior.
                </button>
            </a>

   </main>
